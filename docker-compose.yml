# A three-broker Kafka cluster in KRaft mode (no ZooKeeper), and a web UI.
#
#   docker compose up -d          start (brokers on localhost:9092, 9094, 9096; UI on http://localhost:8088)
#   docker compose stop kafka-2   stop one broker; the cluster keeps working
#   docker compose stop           stop everything, keeping the data
#   docker compose down -v        stop and delete every topic and offset
#
# Each node is both a broker (stores partitions, serves clients) and a
# controller (one of three voters that agree on the cluster's metadata).
# Three voters tolerate one failure: two still make a majority.

x-kafka-env: &kafka-env
  # The cluster's identity. Every node formats its storage with the same ID.
  CLUSTER_ID: 0VxE1nbJSGySvwbjhHEZhg
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # INTERNAL: broker to broker and the UI, inside Docker. EXTERNAL: the app on your laptop.
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Safe defaults for a three-node cluster: every partition on all three
  # brokers, and a write is acknowledged only when two of them have it.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 6
  # Topics are created on purpose, with their settings, never by a typo.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Start consumer groups at once instead of waiting 3 s for more members.
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-kafka: &kafka
  image: apache/kafka:4.3.2
  restart: unless-stopped

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
    volumes: ["kafka-1-data:/var/lib/kafka/data"]

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094
    volumes: ["kafka-2-data:/var/lib/kafka/data"]

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096
    volumes: ["kafka-3-data:/var/lib/kafka/data"]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports: ["8088:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ais-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on: [kafka-1, kafka-2, kafka-3]

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
